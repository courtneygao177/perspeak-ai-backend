name: Deploy PerspeakAI preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - artifacts/ai-presentation/**
      - artifacts/group-project/**
      - deploy/**
      - .github/workflows/deploy-staging.yml
  workflow_dispatch:
    inputs:
      bootstrap_server:
        description: Install or refresh the one-time preview deployment helper
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: perspeak-staging
  cancel-in-progress: true

jobs:
  deploy:
    # Pull requests from forks never receive deployment secrets. The repository
    # variable is enabled only after the one-time server and DNS setup succeeds.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      vars.PERSPEAK_STAGING_DEPLOY == 'true')
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: artifacts/group-project/package-lock.json

      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r artifacts/ai-presentation/requirements.txt pytest
          python -m py_compile artifacts/ai-presentation/app.py artifacts/ai-presentation/mvp_store.py artifacts/ai-presentation/server_store.py artifacts/ai-presentation/audio_engine.py
          python -m pytest artifacts/ai-presentation/tests -q
          cd artifacts/group-project
          npm ci
          npm run test:scenario
          GROUP_PROJECT_BASE=/group-project/ VITE_GROUP_PROJECT_API_BASE=/group-project/api npm run build

      - name: Build a self-contained preview package
        run: |
          python -m pip wheel --wheel-dir .deploy-wheels -r artifacts/ai-presentation/requirements.txt
          tar --exclude='artifacts/group-project/node_modules' --exclude='artifacts/group-project/.env' \
            -czf "/tmp/perspeak-staging-release-${GITHUB_SHA}.tgz" \
            artifacts/ai-presentation artifacts/group-project .deploy-wheels

      - name: Configure SSH
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Bootstrap the preview deployment helper
        if: inputs.bootstrap_server
        run: |
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /tmp/perspeak-github-actions.pub
          scp -q deploy/perspeak-deploy deploy/perspeak-staging-deploy deploy/perspeak-staging-nginx.conf deploy/bootstrap-aliyun.sh /tmp/perspeak-github-actions.pub "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "sudo bash /tmp/bootstrap-aliyun.sh /tmp/perspeak-github-actions.pub"

      - name: Upload and activate the preview
        run: |
          archive="/tmp/perspeak-staging-release-${GITHUB_SHA}.tgz"
          remote_archive="/tmp/perspeak-staging-release-${GITHUB_SHA}.tgz"
          scp -q "$archive" "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_archive}"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "sudo /usr/local/sbin/perspeak-staging-deploy '${GITHUB_SHA}' '${remote_archive}'"

      - name: Verify the active preview services
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8001/ >/dev/null"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8788/api/health >/dev/null"
