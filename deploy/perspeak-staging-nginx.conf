# HTTP is installed first so that Certbot can obtain a certificate once the
# test.perspeakai.cn DNS A record points at this server. Certbot changes this
# file to HTTPS when it is run with its nginx installer.
server {
    listen 80;
    listen [::]:80;
    server_name test.perspeakai.cn;
    client_max_body_size 60m;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
