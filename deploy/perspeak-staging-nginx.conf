# HTTP is installed first so that Certbot can obtain a certificate once the
# test.perspeakai.cn DNS A record points at this server. Certbot changes this
# file to HTTPS when it is run with its nginx installer.
server {
    listen 80;
    listen [::]:80;
    server_name test.perspeakai.cn;
    client_max_body_size 60m;

    location = /group-project {
        return 301 /group-project/;
    }

    location = /_perspeak_group_project_auth {
        internal;
        proxy_pass http://127.0.0.1:8001/x/group-project-auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
    }

    location ^~ /group-project/api/ {
        auth_request /_perspeak_group_project_auth;
        proxy_pass http://127.0.0.1:8788/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location ^~ /group-project/ {
        auth_request /_perspeak_group_project_auth;
        error_page 401 = @group_project_login;
        alias /opt/apps/perspeak-staging-current/artifacts/group-project/dist/;
        try_files $uri $uri/ /group-project/index.html;
    }

    location @group_project_login {
        return 302 /login?next=/group-project/;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
